[package]
name = "mtg-rs"
version = "0.2.1"
edition = "2024"

[dependencies]
tokio = { version = "1.20.0", features = ["macros"]}
sqlx = { version = "0.6.2", features = ["runtime-tokio-native-tls", "sqlite"]}
axum = "0.7.7"
dotenvy = "0.15.7"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.154"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
